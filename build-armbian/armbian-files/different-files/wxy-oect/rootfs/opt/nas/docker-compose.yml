# WXY-OECT NAS 专用 Docker Compose 配置
# 安装 Docker 后执行: cd /root && docker compose up -d
version: "3.8"

services:
  # ---- 手机相册备份 (Syncthing) ----
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    hostname: nas-wxy-oect
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - /mnt/data/syncthing-config:/var/syncthing
      - /mnt/data/album:/album
    ports:
      - "8384:8384"    # Web UI
      - "22000:22000"  # 文件同步 TCP
      - "21027:21027/udp"  # 发现协议 UDP

  # ---- 文件下载器 (可选) ----
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - WEBUI_PORT=8080
    volumes:
      - /mnt/data/downloads/config:/config
      - /mnt/data/downloads/downloads:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"

  # ---- 反向代理/内网穿透 (可选) ----
  frpc:
    image: snowdreamtech/frpc:latest
    container_name: frpc
    restart: unless-stopped
    environment:
      - FRPC_SERVER_ADDR=your-frp-server.com
      - FRPC_SERVER_PORT=7000
      - FRPC_TOKEN=your-token
    volumes:
      - /mnt/data/frp:/etc/frp
