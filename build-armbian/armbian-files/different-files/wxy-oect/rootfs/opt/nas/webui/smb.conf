#===========================================================================
# WXY-OECT NAS 专用 Samba 配置
#===========================================================================

[global]
    workgroup = WORKGROUP
    server string = WXY-OECT NAS
    dns proxy = no
    log file = /var/log/samba/log.%m
    max log size = 1000
    logging = file
    panic action = /usr/share/samba/panic-action %d
    server role = standalone server
    obey pam restrictions = yes
    unix password sync = yes
    passwd program = /usr/bin/passwd %u
    passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
    pam password change = yes
    map to guest = bad user
    usershare allow guests = yes
    null passwords = yes
    guest account = nobody
    min protocol = SMB2
    unix charset = UTF-8
    dos charset = CP936

[share]
    comment = NAS 共享空间
    path = /mnt/data/share
    browseable = yes
    writable = yes
    guest ok = yes
    create mask = 0644
    directory mask = 0755
    force user = root
    force group = root
    public = yes

[album]
    comment = 手机相册自动备份
    path = /mnt/data/album
    browseable = yes
    writable = yes
    guest ok = yes
    create mask = 0644
    directory mask = 0755
    force user = root
    force group = root
    public = yes

[downloads]
    comment = 下载目录
    path = /mnt/data/downloads
    browseable = yes
    writable = yes
    guest ok = yes
    create mask = 0644
    directory mask = 0755
    force user = root
    force group = root
    public = yes
