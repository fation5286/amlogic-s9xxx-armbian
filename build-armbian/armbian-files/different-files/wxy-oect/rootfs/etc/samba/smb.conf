# WXY-OECT NAS 专用 Samba 配置
# 安装 samba 后复制此文件为 /etc/samba/smb.conf
# 或直接在 smb.conf 中包含此文件

[share]
    comment = WXY-OECT NAS 共享空间
    path = /mnt/data
    browseable = yes
    writable = yes
    guest ok = yes
    create mask = 0644
    directory mask = 0755
    force user = root
    force group = root
    public = yes
    available = yes

# 手机相册自动备份
[album]
    comment = 手机相册自动备份
    path = /mnt/data/album
    browseable = yes
    writable = yes
    guest ok = yes
    create mask = 0644
    directory mask = 0755
    force user = root
    force group = root
    public = yes
    available = yes
