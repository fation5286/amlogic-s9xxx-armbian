name: Build NAS Image for WXY-OECT

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: '操作系统版本'
        required: true
        default: 'bookworm'
        type: choice
        options:
          - resolute
          - bookworm
          - jammy
      kernel_version:
        description: '内核版本'
        required: true
        default: '6.1.y'
        type: choice
        options:
          - 6.1.y
          - 6.6.y
          - stable/6.12.y
      target_device:
        description: '目标设备'
        required: true
        default: 'wxy-oect'
        type: choice
        options:
          - wxy-oect
          - wxy-oect-mod
      image_type:
        description: '镜像类型'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - desktop

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'fation5286'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build NAS image
        id: build
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_path: https://github.com/ophub/amlogic-s9xxx-armbian/releases/download/Armbian_bookworm_arm64_server_2026.07/Armbian_26.08.0_rockchip_wxy-oect_bookworm_6.1.141_server_2026.07.01.img.gz
          armbian_board: ${{ github.event.inputs.target_device }}
          armbian_kernel: ${{ github.event.inputs.kernel_version }}
          auto_kernel: true
          armbian_fstype: ext4
          armbian_size: 512/3000
          armbian_files: build-armbian/armbian-files/different-files/wxy-oect/rootfs/etc
          builder_name: "WXY-OECT-NAS"

      - name: Inject NAS files (Web UI v3 - 按需启动)
        run: |
          set -ex
          
          ACTION_OUT="${{ env.PACKAGED_OUTPUTPATH }}"
          IMG=$(ls -t ${ACTION_OUT}/*.img.gz 2>/dev/null | grep -v '07.01' | head -n 1)
          [ -z "$IMG" ] && IMG=$(ls -t ${ACTION_OUT}/*.img.gz 2>/dev/null | head -n 1)
          [ -z "$IMG" ] && IMG=$(ls -t ${ACTION_OUT}/*.img 2>/dev/null | head -n 1)
          [ -n "$IMG" ] || { echo "FATAL: no image"; exit 1; }
          echo ">>> Image: $(basename "$IMG") ($(du -hm "$IMG" | cut -f1)MB)"
          
          gunzip -f "$IMG"
          IMG="${IMG%.gz}"
          
          LOOP=$(sudo losetup --find --show --partscan "$IMG")
          sleep 2
          
          if [ -b "${LOOP}p2" ]; then
            LOOP_PART="${LOOP}p2"
          elif [ -b "${LOOP}p1" ]; then
            LOOP_PART="${LOOP}p1"
          else
            echo "FATAL: no partition found on $LOOP"
            ls -la ${LOOP}*
            exit 1
          fi
          echo ">>> Mounting: $LOOP_PART"
          
          sudo mkdir -p /mnt/nasimg
          sudo mount "$LOOP_PART" /mnt/nasimg
          
          # 复制 NAS 文件
          sudo mkdir -p /mnt/nasimg/opt/nas
          sudo cp -rv build-armbian/armbian-files/different-files/wxy-oect/rootfs/opt/* /mnt/nasimg/opt/
          
          # 复制精简脚本
          sudo cp -v build-armbian/armbian-files/different-files/wxy-oect/rootfs/etc/init-nas-services.sh /mnt/nasimg/etc/
          sudo cp -v build-armbian/armbian-files/different-files/wxy-oect/rootfs/etc/setup-nas-base.sh /mnt/nasimg/etc/
          
          # 复制 systemd 服务文件
          sudo cp -v build-armbian/armbian-files/different-files/wxy-oect/rootfs/etc/systemd/system/nas-webui.service /mnt/nasimg/etc/systemd/system/
          
          echo ">>> Verified files:"
          ls -la /mnt/nasimg/opt/nas/
          ls -la /mnt/nasimg/opt/nas/webui/
          ls -la /mnt/nasimg/etc/init-nas-services.sh
          ls -la /mnt/nasimg/etc/systemd/system/nas-webui.service
          
          [ -f /mnt/nasimg/opt/nas/install-nas.sh ] || { echo "FATAL: install-nas.sh missing"; exit 1; }
          [ -f /mnt/nasimg/opt/nas/webui/nas-webui.py ] || { echo "FATAL: nas-webui.py missing"; exit 1; }
          [ -f /mnt/nasimg/etc/init-nas-services.sh ] || { echo "FATAL: init-nas-services.sh missing"; exit 1; }
          [ -f /mnt/nasimg/etc/systemd/system/nas-webui.service ] || { echo "FATAL: nas-webui.service missing"; exit 1; }
          
          # 设置权限
          sudo chmod +x /mnt/nasimg/opt/nas/install-nas.sh
          sudo chmod +x /mnt/nasimg/opt/nas/webui/nas-webui.py
          
          sync
          sudo umount /mnt/nasimg
          sudo rmdir /mnt/nasimg
          sudo losetup -D
          echo ">>> Done."
          
          LOOP2=$(sudo losetup --find --show --partscan "$IMG")
          sleep 3
          [ -b "${LOOP2}p2" ] && LOOP2_PART="${LOOP2}p2" || LOOP2_PART="${LOOP2}p1"
          sudo mkdir -p /mnt/nasimg
          sudo mount "$LOOP2_PART" /mnt/nasimg
          echo ">>> Double-check:"
          ls /mnt/nasimg/opt/nas/
          ls /mnt/nasimg/opt/nas/webui/
          sudo umount /mnt/nasimg
          sudo rmdir /mnt/nasimg
          sudo losetup -D
          echo "=== ALL CHECKS PASSED ==="

      - name: Compress image
        run: |
          cd "${{ env.PACKAGED_OUTPUTPATH }}"
          gzip -qf *.img 2>/dev/null || true
          ls -lh

      - name: Upload NAS image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nas-image-${{ github.event.inputs.target_device }}-${{ github.event.inputs.os_version }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img*
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: WXY-OECT NAS Image ${{ github.event.inputs.os_version }} ${{ github.event.inputs.kernel_version }}
          tag_name: nas-${{ github.event.inputs.target_device }}-${{ github.event.inputs.os_version }}-${{ github.sha }}
          files: ${{ env.PACKAGED_OUTPUTPATH }}/*.img*
          body: |
            ## WXY-OECT NAS 专用镜像 (按需启动版)
            
            - **设备**: ${{ github.event.inputs.target_device }}
            - **系统**: ${{ github.event.inputs.os_version }}
            - **内核**: ${{ github.event.inputs.kernel_version }}
            - **类型**: ${{ github.event.inputs.image_type }}
            
            ### 新增特性 (v3)
            - **按需启动 Web UI**: 访问时自动启动，闲置3分钟后自动退出
            - **节省资源**: 不使用时内存占用为 0
            - **类 iStoreOS 界面**: 深色主题，卡片式布局
            
            ### 内置服务
            - SSH (openssh-server)
            - Samba (文件共享)
            - Docker (容器运行时)
            - Web UI 管理面板 (:8080)
            
            ### 精简内容
            - 禁用了 ModemManager, bluetooth, cups, thermald, colord, pulseaudio 等服务
            - 移除了桌面环境和多余工具
            - 预计开机内存占用: < 120MB
            
            ### 首次使用
            1. 下载并解压 .img 文件
            2. 使用 RKDevTool 刷入 eMMC 或 TF 卡
            3. 首次启动后运行: `bash /opt/nas/install-nas.sh`
            4. 浏览器访问 http://NAS_IP:8080 管理 NAS
