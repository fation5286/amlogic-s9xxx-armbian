name: Build NAS Image for WXY-OECT

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: '操作系统版本'
        required: true
        default: 'resolute'
        type: choice
        options:
          - resolute
          - bookworm
          - jammy
      kernel_version:
        description: '内核版本'
        required: true
        default: '6.1.y'
        type: choice
        options:
          - 6.1.y
          - 6.6.y
          - stable/6.12.y
      target_device:
        description: '目标设备'
        required: true
        default: 'wxy-oect'
        type: choice
        options:
          - wxy-oect
          - wxy-oect-mod
      image_type:
        description: '镜像类型'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - desktop

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'fation5286'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build NAS image
        id: build
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_path: https://github.com/ophub/amlogic-s9xxx-armbian/releases/download/Armbian_resolute_arm64_server_2026.07/Armbian_26.08.0_rockchip_wxy-oect_resolute_6.1.141_server_2026.07.01.img.gz
          armbian_board: ${{ github.event.inputs.target_device }}
          armbian_kernel: ${{ github.event.inputs.kernel_version }}
          auto_kernel: true
          armbian_fstype: ext4
          armbian_size: 512/3000
          armbian_files: build-armbian/armbian-files/different-files/wxy-oect/rootfs/etc
          builder_name: "WXY-OECT-NAS"

      - name: Inject NAS files
        run: |
          set -ex
          
          # Step 1: Find newest built image (skip original downloaded)
          ACTION_OUT="${{ env.PACKAGED_OUTPUTPATH }}"
          IMG=$(ls -t ${ACTION_OUT}/*.img.gz 2>/dev/null | grep -v '07.01' | head -n 1)
          [ -z "$IMG" ] && IMG=$(ls -t ${ACTION_OUT}/*.img.gz 2>/dev/null | head -n 1)
          [ -z "$IMG" ] && IMG=$(ls -t ${ACTION_OUT}/*.img 2>/dev/null | head -n 1)
          [ -n "$IMG" ] || { echo "FATAL: no image"; exit 1; }
          echo ">>> Image: $(basename "$IMG") ($(du -hm "$IMG" | cut -f1)MB)"
          
          # Step 2: Decompress
          gunzip -f "$IMG"
          IMG="${IMG%.gz}"
          
          # Step 3: Loop mount with --partscan + sleep for kernel
          LOOP=$(sudo losetup --find --show --partscan "$IMG")
          sleep 2
          
          # Step 4: Find partition device — brute force scan
          LOOP_PART=""
          for suffix in p1 p2 p3 p4 p5 p6 p7 p8 p9 p10; do
            candidate="${LOOP}${suffix}"
            if [ -b "$candidate" ]; then
              LOOP_PART="$candidate"
              echo ">>> Found partition: $LOOP_PART"
              break
            fi
          done
          [ -n "$LOOP_PART" ] || { echo "FATAL: no partition on $LOOP"; ls -la ${LOOP}*; exit 1; }
          
          # Step 5: Mount, inject, verify
          sudo mkdir -p /mnt/nasimg
          sudo mount "$LOOP_PART" /mnt/nasimg
          
          # Inject opt/nas
          sudo mkdir -p /mnt/nasimg/opt/nas
          sudo cp -rv build-armbian/armbian-files/different-files/wxy-oect/rootfs/opt/* /mnt/nasimg/opt/
          
          # Verify
          echo ">>> Verified opt/nas:"
          ls -la /mnt/nasimg/opt/nas/
          [ -f /mnt/nasimg/opt/nas/install-nas.sh ] || { echo "FATAL: install-nas.sh missing"; exit 1; }
          [ -d /mnt/nasimg/opt/nas/webui ] || { echo "FATAL: webui missing"; exit 1; }
          
          # Step 6: Cleanup
          sync
          sudo umount /mnt/nasimg
          sudo rmdir /mnt/nasimg
          sudo losetup -D
          echo ">>> Injection verified and cleaned up."
          
          # Step 7: Double-check — remount and verify again
          LOOP2=$(sudo losetup --find --show --partscan "$IMG")
          sleep 1
          LOOP2_PART=""
          for s in p2 p1 p3; do
            [ -b "${LOOP2}${s}" ] && LOOP2_PART="${LOOP2}${s}" && break
          done
          [ -n "$LOOP2_PART" ] || { echo "FATAL: double-check no partition"; exit 1; }
          sudo mkdir -p /mnt/nasimg
          sudo mount "$LOOP2_PART" /mnt/nasimg
          echo ">>> Double-check opt/nas:"
          ls /mnt/nasimg/opt/nas/
          sudo umount /mnt/nasimg
          sudo rmdir /mnt/nasimg
          sudo losetup -D
          echo "=== ALL CHECKS PASSED ==="

      - name: Compress image
        run: |
          cd "${{ env.PACKAGED_OUTPUTPATH }}"
          gzip -qf *.img 2>/dev/null || true
          ls -lh

      - name: Upload NAS image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nas-image-${{ github.event.inputs.target_device }}-${{ github.event.inputs.os_version }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img*
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: WXY-OECT NAS Image ${{ github.event.inputs.os_version }} ${{ github.event.inputs.kernel_version }}
          tag_name: nas-${{ github.event.inputs.target_device }}-${{ github.event.inputs.os_version }}-${{ github.sha }}
          files: ${{ env.PACKAGED_OUTPUTPATH }}/*.img*
          body: |
            ## WXY-OECT NAS 专用镜像
            
            - **设备**: ${{ github.event.inputs.target_device }}
            - **系统**: ${{ github.event.inputs.os_version }}
            - **内核**: ${{ github.event.inputs.kernel_version }}
            - **类型**: ${{ github.event.inputs.image_type }}
            
            ### 内置服务
            - SSH (openssh-server)
            - Samba (文件共享)
            - Docker (容器运行时)
            - Web UI 管理面板 (:8080)
            
            ### 精简内容
            - 禁用了 ModemManager, bluetooth, cups, thermald, colord, pulseaudio 等服务
            - 移除了桌面环境和多余工具
            - 预计开机内存占用: < 120MB
            
            ### 首次使用
            1. 下载并解压 .img 文件
            2. 使用 RKDevTool 刷入 eMMC 或 TF 卡
            3. 首次启动后运行: `bash /opt/nas/install-nas.sh`
            4. 浏览器访问 http://NAS_IP:8080 管理 NAS