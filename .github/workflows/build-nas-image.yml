name: Build NAS Image for WXY-OECT

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: '操作系统版本'
        required: true
        default: 'resolute'
        type: choice
        options:
          - resolute
          - bookworm
          - jammy
      kernel_version:
        description: '内核版本'
        required: true
        default: '6.1.y'
        type: choice
        options:
          - 6.1.y
          - 6.6.y
          - stable/6.12.y
      target_device:
        description: '目标设备'
        required: true
        default: 'wxy-oect'
        type: choice
        options:
          - wxy-oect
          - wxy-oect-mod
      image_type:
        description: '镜像类型'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - desktop

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'fation5286'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build NAS image
        id: build
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_path: https://github.com/ophub/amlogic-s9xxx-armbian/releases/download/Armbian_resolute_arm64_server_2026.07/Armbian_26.08.0_rockchip_wxy-oect_resolute_6.1.141_server_2026.07.01.img.gz
          armbian_board: ${{ github.event.inputs.target_device }}
          armbian_kernel: ${{ github.event.inputs.kernel_version }}
          auto_kernel: true
          armbian_fstype: ext4
          armbian_size: 512/3000
          armbian_files: build-armbian/armbian-files/different-files/wxy-oect/rootfs/etc
          builder_name: "WXY-OECT-NAS"

      - name: Inject NAS files
        run: |
          set -ex
          
          # === Step 1: Find newest built image ===
          ACTION_OUT="${{ env.PACKAGED_OUTPUTPATH }}"
          echo "=== Output dir: ${ACTION_OUT} ==="
          ls -lht "${ACTION_OUT}"/
          
          IMG=$(ls -t ${ACTION_OUT}/*.img.gz 2>/dev/null | grep -v '07.01' | head -n 1)
          if [ -z "$IMG" ]; then
            IMG=$(ls -t ${ACTION_OUT}/*.img.gz 2>/dev/null | head -n 1)
          fi
          if [ -z "$IMG" ]; then
            IMG=$(ls -t ${ACTION_OUT}/*.img 2>/dev/null | head -n 1)
          fi
          [ -n "$IMG" ] || { echo "FATAL: no image found"; exit 1; }
          echo ">>> Selected: $(basename "$IMG") ($(du -hm "$IMG" | cut -f1)MB)"
          
          # === Step 2: Decompress ===
          gunzip -f "$IMG"
          IMG="${IMG%.gz}"
          
          # === Step 3: Loop mount with partition scan ===
          LOOP=$(sudo losetup --find --show --partscan "$IMG")
          echo ">>> Loop: $LOOP"
          sleep 2  # Give kernel time to create partition nodes
          
          # === Step 4: Verify partition devices exist ===
          echo ">>> Checking partition devices..."
          ls -la ${LOOP}* 2>/dev/null || true
          
          # Use kpartx if available, otherwise fall back to direct partition nodes
          if command -v kpartx &>/dev/null; then
            echo ">>> Using kpartx..."
            sudo kpartx -av "$IMG" 2>/dev/null || true
            LOOP_PART="/dev/mapper/$(sudo kpartx -lv "$IMG" 2>/dev/null | tail -1 | awk '{print $3}')p2"
          else
            # Direct partition: loop0p2 is always rootfs for Armbian images
            LOOP_PART="${LOOP}p2"
            if [ ! -b "$LOOP_PART" ]; then
              LOOP_PART="${LOOP}p1"
              echo ">>> Warning: p2 not found, trying p1"
            fi
          fi
          
          echo ">>> Will mount: $LOOP_PART"
          [ -b "$LOOP_PART" ] || { echo "FATAL: partition device $LOOP_PART does not exist"; exit 1; }
          
          # === Step 5: Mount and inject ===
          sudo mkdir -p /mnt/nasimg
          sudo mount "$LOOP_PART" /mnt/nasimg
          echo ">>> Mounted. Checking rootfs..."
          ls /mnt/nasimg/opt/ 2>/dev/null || true
          ls /mnt/nasimg/etc/ 2>/dev/null || true
          
          # Copy opt/nas (Web UI + install script)
          sudo mkdir -p /mnt/nasimg/opt/nas
          sudo cp -rv build-armbian/armbian-files/different-files/wxy-oect/rootfs/opt/* /mnt/nasimg/opt/
          echo ">>> opt/nas injected"
          
          # === Step 6: Cleanup ===
          sync
          sudo umount /mnt/nasimg
          sudo rmdir /mnt/nasimg
          
          if command -v kpartx &>/dev/null; then
            sudo kpartx -dv "$IMG" 2>/dev/null || true
          fi
          sudo losetup -D
          echo ">>> Done!"
          
          # === Step 7: Verify injection ===
          LOOP2=$(sudo losetup --find --show --partscan "$IMG")
          sleep 1
          LOOP2_PART="${LOOP2}p2"
          [ -b "$LOOP2_PART" ] || LOOP2_PART="${LOOP2}p1"
          sudo mount "$LOOP2_PART" /mnt/nasimg
          echo ">>> Verifying opt/nas files:"
          ls -la /mnt/nasimg/opt/nas/
          sudo umount /mnt/nasimg
          sudo losetup -D
          
          echo "=== VERIFICATION PASSED ==="

      - name: Compress image
        run: |
          cd "${{ env.PACKAGED_OUTPUTPATH }}"
          gzip -qf *.img 2>/dev/null || true
          ls -lh

      - name: Upload NAS image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nas-image-${{ github.event.inputs.target_device }}-${{ github.event.inputs.os_version }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img*
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: WXY-OECT NAS Image ${{ github.event.inputs.os_version }} ${{ github.event.inputs.kernel_version }}
          tag_name: nas-${{ github.event.inputs.target_device }}-${{ github.event.inputs.os_version }}-${{ github.sha }}
          files: ${{ env.PACKAGED_OUTPUTPATH }}/*.img*
          body: |
            ## WXY-OECT NAS 专用镜像
            
            - **设备**: ${{ github.event.inputs.target_device }}
            - **系统**: ${{ github.event.inputs.os_version }}
            - **内核**: ${{ github.event.inputs.kernel_version }}
            - **类型**: ${{ github.event.inputs.image_type }}
            
            ### 内置服务
            - SSH (openssh-server)
            - Samba (文件共享)
            - Docker (容器运行时)
            - Web UI 管理面板 (:8080)
            
            ### 精简内容
            - 禁用了 ModemManager, bluetooth, cups, thermald, colord, pulseaudio 等服务
            - 移除了桌面环境和多余工具
            - 预计开机内存占用: < 120MB
            
            ### 首次使用
            1. 下载并解压 .img 文件
            2. 使用 RKDevTool 刷入 eMMC 或 TF 卡
            3. 首次启动后运行: `bash /opt/nas/install-nas.sh`
            4. 浏览器访问 http://NAS_IP:8080 管理 NAS