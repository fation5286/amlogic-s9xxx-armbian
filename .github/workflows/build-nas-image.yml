name: Build NAS Image for WXY-OECT

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: '鎿嶄綔绯荤粺鐗堟湰'
        required: true
        default: 'bookworm'
        type: choice
        options:
          - bookworm
          - jammy
          - noble
      kernel_version:
        description: '鍐呮牳鐗堟湰'
        required: true
        default: '6.1.y'
        type: choice
        options:
          - 6.1.y
          - 6.6.y
          - stable/6.12.y
      target_device:
        description: '鐩爣璁惧'
        required: true
        default: 'wxy-oect'
        type: choice
        options:
          - wxy-oect
          - wxy-oect-mod
      image_type:
        description: '闀滃儚绫诲瀷'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - desktop
      debian_base:
        description: '鍚敤鍚庡皢鍙畨瑁呮渶灏忓寲鍖咃紝涓嶅寘鍚闈㈢幆澧冨拰澶氫綑鏈嶅姟'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'fation5286'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support crossbuild-essential-arm64
          
      - name: Build NAS image for wxy-oect
        run: |
          # 璁剧疆鏋勫缓鍙傛暟
          export TARGET_DEVICE="${{ github.event.inputs.target_device }}"
          export OS_VERSION="${{ github.event.inputs.os_version }}"
          export KERNEL_VERSION="${{ github.event.inputs.kernel_version }}"
          export IMAGE_TYPE="${{ github.event.inputs.image_type }}"
          
          # 濡傛灉鏄簿绠€妯″紡锛岃缃渶灏忓寲鏋勫缓鏍囧織
          if [ "${{ github.event.inputs.debian_base }}" = "true" ]; then
            export MINIMAL_BUILD="true"
            echo "鍚敤绮剧畝鏋勫缓妯″紡锛屽皢鏈€灏忓寲 systemd 鏈嶅姟鍜屽畨瑁呭寘"
          fi
          
          # 鎵ц鏋勫缓
          bash ./rebuild \
            --device "${TARGET_DEVICE}" \
            --os "${OS_VERSION}" \
            --kernel "${KERNEL_VERSION}" \
            --image-type "${IMAGE_TYPE}"
          
          echo "鏋勫缓瀹屾垚锛?

      - name: Upload NAS image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nas-image-${{ github.event.inputs.target_device }}-${{ github.event.inputs.os_version }}
          path: output/*.img*
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: WXY-OECT NAS Image ${{ github.event.inputs.os_version }} ${{ github.event.inputs.kernel_version }}
          tag_name: nas-${{ github.event.inputs.target_device }}-${{ github.event.inputs.os_version }}-${{ github.sha }}
          files: output/*.img*
          body: |
            ## WXY-OECT NAS 涓撶敤闀滃儚
            
            - **璁惧**: ${{ github.event.inputs.target_device }}
            - **绯荤粺**: ${{ github.event.inputs.os_version }}
            - **鍐呮牳**: ${{ github.event.inputs.kernel_version }}
            - **绫诲瀷**: ${{ github.event.inputs.image_type }}
            
            ### 鍐呯疆鏈嶅姟
            - SSH (openssh-server)
            - Samba (鏂囦欢鍏变韩)
            - Docker (瀹瑰櫒杩愯鏃?
            
            ### 绮剧畝鍐呭
            - 绂佺敤浜?ModemManager, bluetooth, cups, thermald 绛夋湇鍔?            - 绉婚櫎浜嗘闈㈢幆澧冨拰澶氫綑宸ュ叿
            - 棰勮寮€鏈哄唴瀛樺崰鐢? < 150MB
            
            ### 浣跨敤鏂规硶
            1. 涓嬭浇骞惰В鍘?.img 鏂囦欢
            2. 浣跨敤 RKDevTool 鍒峰叆 eMMC 鎴?TF 鍗?            3. 棣栨鍚姩鍚庤繍琛? `bash /opt/nas/install-nas.sh`
