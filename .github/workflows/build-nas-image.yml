name: Build NAS Image for WXY-OECT

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: '操作系统版本'
        required: true
        default: 'bookworm'
        type: choice
        options:
          - resolute
          - bookworm
          - jammy
          - trixie
      kernel_version:
        description: '内核版本'
        required: true
        default: '6.1.y'
        type: choice
        options:
          - 6.1.y
          - 6.6.y
          - stable/6.12.y
      target_device:
        description: '目标设备'
        required: true
        default: 'wxy-oect'
        type: choice
        options:
          - wxy-oect
          - wxy-oect-mod
      image_type:
        description: '镜像类型'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - desktop

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'fation5286'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Initialize build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat compile-kernel/tools/script/ubuntu2404-build-armbian-depends)
          sudo systemctl daemon-reload

      - name: Create output directory
        run: |
          mkdir -p build/output/images

      - name: Download base Armbian image
        run: |
          cd build/output/images
          # 下载原始镜像作为基础
          curl -fsSL "https://github.com/ophub/amlogic-s9xxx-armbian/releases/download/Armbian_bookworm_arm64_server_2026.07/Armbian_26.08.0_rockchip_wxy-oect_bookworm_6.1.141_server_2026.07.01.img.gz" \
            -o "Armbian_26.08.0_rockchip_wxy-oect_bookworm_6.1.141_server_2026.07.01.img.gz"
          echo "下载完成"
          ls -lh *.img.gz

      - name: Rebuild Armbian with NAS config
        run: |
          cd build/output/images
          # 解压原始镜像
          gunzip -f Armbian_26.08.0_rockchip_wxy-oect_bookworm_6.1.141_server_2026.07.01.img.gz
          
          # 使用 rebuild 脚本重新打包，应用我们的配置
          cd ../..
          sudo ./rebuild \
            -b ${{ github.event.inputs.target_device }} \
            -k ${{ github.event.inputs.kernel_version }} \
            -a true \
            -t ext4 \
            -s 512/3000 \
            -n "WXY-OECT-NAS"
          
          echo "打包完成"
          ls -lh build/output/images/

      - name: Verify NAS files
        run: |
          IMG=$(ls -t build/output/images/*.img 2>/dev/null | head -n 1)
          [ -z "$IMG" ] && { echo "FATAL: no image found"; exit 1; }
          
          echo ">>> Image: $(basename "$IMG") ($(du -hm "$IMG" | cut -f1)MB)"
          
          # 挂载镜像检查
          LOOP=$(sudo losetup --find --show --partscan "$IMG")
          sleep 2
          
          if [ -b "${LOOP}p2" ]; then
            LOOP_PART="${LOOP}p2"
          elif [ -b "${LOOP}p1" ]; then
            LOOP_PART="${LOOP}p1"
          else
            echo "FATAL: no partition found"
            ls -la ${LOOP}*
            exit 1
          fi
          
          sudo mkdir -p /mnt/nasimg
          sudo mount "$LOOP_PART" /mnt/nasimg
          
          echo ">>> Checking NAS files:"
          ls -la /mnt/nasimg/opt/nas/
          ls -la /mnt/nasimg/opt/nas/webui/
          ls -la /mnt/nasimg/etc/init-nas-services.sh
          ls -la /mnt/nasimg/etc/systemd/system/nas-webui.service
          
          [ -f /mnt/nasimg/opt/nas/install-nas.sh ] || { echo "FATAL: install-nas.sh missing"; exit 1; }
          [ -f /mnt/nasimg/opt/nas/webui/nas-webui.py ] || { echo "FATAL: nas-webui.py missing"; exit 1; }
          [ -f /mnt/nasimg/etc/init-nas-services.sh ] || { echo "FATAL: init-nas-services.sh missing"; exit 1; }
          [ -f /mnt/nasimg/etc/systemd/system/nas-webui.service ] || { echo "FATAL: nas-webui.service missing"; exit 1; }
          
          # 验证 Web UI 是否包含按需启动特性
          grep -q "IDLE_TIMEOUT" /mnt/nasimg/opt/nas/webui/nas-webui.py || { echo "FATAL: idle timeout not found"; exit 1; }
          grep -q "start_webui" /mnt/nasimg/opt/nas/webui/nas-webui.py || { echo "FATAL: start_webui function missing"; exit 1; }
          
          sudo umount /mnt/nasimg
          sudo rmdir /mnt/nasimg
          sudo losetup -D
          
          echo "=== ALL CHECKS PASSED ==="

      - name: Compress image
        run: |
          cd build/output/images
          gzip -qf *.img 2>/dev/null || true
          ls -lh *.img.gz
          echo "PACKAGED_OUTPUTPATH=${PWD}" >> ${GITHUB_ENV}
          echo "PACKAGED_OUTPUTDATE=$(date +"%m.%d.%H%M")" >> ${GITHUB_ENV}
          echo "PACKAGED_STATUS=success" >> ${GITHUB_ENV}

      - name: Upload NAS image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nas-image-${{ github.event.inputs.target_device }}-${{ github.event.inputs.os_version }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img*
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: WXY-OECT NAS Image ${{ github.event.inputs.os_version }} ${{ github.event.inputs.kernel_version }}
          tag_name: nas-${{ github.event.inputs.target_device }}-${{ github.event.inputs.os_version }}-${{ github.sha }}
          files: ${{ env.PACKAGED_OUTPUTPATH }}/*.img*
          body: |
            ## WXY-OECT NAS 专用镜像 (按需启动版)
            
            - **设备**: ${{ github.event.inputs.target_device }}
            - **系统**: ${{ github.event.inputs.os_version }}
            - **内核**: ${{ github.event.inputs.kernel_version }}
            - **类型**: ${{ github.event.inputs.image_type }}
            
            ### 构建方式
            使用仓库自带 rebuild 脚本从源码打包，所有配置直接在仓库中管理
            
            ### 新增特性 (v3)
            - **按需启动 Web UI**: 访问时自动启动，闲置3分钟后自动退出
            - **节省资源**: 不使用时内存占用为 0
            - **类 iStoreOS 界面**: 深色主题，卡片式布局
            
            ### 内置服务
            - SSH (openssh-server)
            - Samba (文件共享)
            - Docker (容器运行时)
            - Web UI 管理面板 (:8080)
            
            ### 精简内容
            - 禁用了 ModemManager, bluetooth, cups, thermald, colord, pulseaudio 等服务
            - 移除了桌面环境和多余工具
            - 预计开机内存占用: < 120MB
            
            ### 首次使用
            1. 下载并解压 .img 文件
            2. 使用 RKDevTool 刷入 eMMC 或 TF 卡
            3. 首次启动后运行: `bash /opt/nas/install-nas.sh`
            4. 浏览器访问 http://NAS_IP:8080 管理 NAS
