name: Build NAS Image for WXY-OECT

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: '操作系统版本'
        required: true
        default: 'resolute'
        type: choice
        options:
          - resolute
          - bookworm
          - jammy
      kernel_version:
        description: '内核版本'
        required: true
        default: '6.1.y'
        type: choice
        options:
          - 6.1.y
          - 6.6.y
          - stable/6.12.y
      target_device:
        description: '目标设备'
        required: true
        default: 'wxy-oect'
        type: choice
        options:
          - wxy-oect
          - wxy-oect-mod
      image_type:
        description: '镜像类型'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - desktop

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'fation5286'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build NAS image
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_path: https://github.com/ophub/amlogic-s9xxx-armbian/releases/download/Armbian_resolute_arm64_server_2026.07/Armbian_26.08.0_rockchip_wxy-oect_resolute_6.1.141_server_2026.07.01.img.gz
          armbian_board: ${{ github.event.inputs.target_device }}
          armbian_kernel: ${{ github.event.inputs.kernel_version }}
          auto_kernel: true
          armbian_fstype: ext4
          armbian_size: 512/3000
          armbian_files: build-armbian/armbian-files/different-files/wxy-oect/rootfs/etc
          builder_name: "WXY-OECT-NAS"

      - name: Debug action output
        run: |
          echo "=== github.action_path: ${{ github.action_path }} ==="
          echo "=== github.workspace: ${{ github.workspace }} ==="
          ls -lhR "${{ github.action_path }}/build/" 2>/dev/null || echo "No build dir in action_path"
          echo "=== Workspace output dirs ==="
          find ${{ github.workspace }} -name "*.img*" -type f 2>/dev/null || echo "No img files in workspace"
          find /home/runner/work -maxdepth 4 -name "*.img*" -type f 2>/dev/null | head -20 || echo "No img files found"
          echo "=== ENV vars ==="
          env | grep -i pack | head -10 || true

      - name: Inject opt/nas files
        run: |
          set -e
          ACTION_OUT="${{ github.action_path }}/build/output/images"
          echo "Looking for image in: ${ACTION_OUT}"
          ls -lh "${ACTION_OUT}"/ 2>/dev/null || echo "Directory does not exist or is empty"
          
          IMG=$(ls ${ACTION_OUT}/*.img.gz 2>/dev/null | head -n 1)
          if [ -z "$IMG" ]; then
            IMG=$(ls ${ACTION_OUT}/*.img 2>/dev/null | head -n 1)
          fi
          if [ -z "$IMG" ]; then
            echo "ERROR: No image found in ${ACTION_OUT}"
            exit 1
          fi
          
          echo "Found image: $IMG ($(du -h "$IMG" | cut -f1))"
          gunzip -f "$IMG"
          IMG="${IMG%.gz}"
          
          LOOP=$(sudo losetup --find --show "$IMG")
          LOOP_DEV="${LOOP}p2"
          sudo mkdir -p /mnt/img
          sudo mount "$LOOP_DEV" /mnt/img
          
          sudo mkdir -p /mnt/img/opt/nas
          sudo cp -rv build-armbian/armbian-files/different-files/wxy-oect/rootfs/opt/* /mnt/img/opt/ 2>/dev/null || true
          
          sync
          sudo umount /mnt/img
          sudo losetup -d "$LOOP"
          sudo rmdir /mnt/img
          echo "Injection complete!"

      - name: Compress image
        run: |
          cd "${{ github.action_path }}/build/output/images"
          gzip -qf *.img 2>/dev/null || true
          ls -lh

      - name: Upload NAS image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nas-image-${{ github.event.inputs.target_device }}-${{ github.event.inputs.os_version }}
          path: ${{ github.action_path }}/build/output/images/*.img*
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: WXY-OECT NAS Image ${{ github.event.inputs.os_version }} ${{ github.event.inputs.kernel_version }}
          tag_name: nas-${{ github.event.inputs.target_device }}-${{ github.event.inputs.os_version }}-${{ github.sha }}
          files: ${{ github.action_path }}/build/output/images/*.img*
          body: |
            ## WXY-OECT NAS 专用镜像
            
            - **设备**: ${{ github.event.inputs.target_device }}
            - **系统**: ${{ github.event.inputs.os_version }}
            - **内核**: ${{ github.event.inputs.kernel_version }}
            - **类型**: ${{ github.event.inputs.image_type }}
            
            ### 内置服务
            - SSH (openssh-server)
            - Samba (文件共享)
            - Docker (容器运行时)
            - Web UI 管理面板 (:8080)
            
            ### 精简内容
            - 禁用了 ModemManager, bluetooth, cups, thermald, colord, pulseaudio 等服务
            - 移除了桌面环境和多余工具
            - 预计开机内存占用: < 120MB
            
            ### 首次使用
            1. 下载并解压 .img 文件
            2. 使用 RKDevTool 刷入 eMMC 或 TF 卡
            3. 首次启动后运行: `bash /opt/nas/install-nas.sh`
            4. 浏览器访问 http://NAS_IP:8080 管理 NAS