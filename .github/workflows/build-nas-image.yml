name: Build NAS Image for WXY-OECT

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: '操作系统版本'
        required: true
        default: 'bookworm'
        type: choice
        options:
          - resolute
          - bookworm
          - jammy
          - trixie
      kernel_version:
        description: '内核版本'
        required: true
        default: '6.1.y'
        type: choice
        options:
          - 6.1.y
          - 6.6.y
          - stable/6.12.y
      target_device:
        description: '目标设备'
        required: true
        default: 'wxy-oect'
        type: choice
        options:
          - wxy-oect
          - wxy-oect-mod
      image_type:
        description: '镜像类型'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - desktop

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'fation5286'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Initialize build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat compile-kernel/tools/script/ubuntu2404-build-armbian-depends)
          sudo systemctl daemon-reload

      - name: Create output directory
        run: |
          mkdir -p build/output/images

      - name: Download base Armbian image
        run: |
          cd build/output/images
          curl -fsSL "https://github.com/ophub/amlogic-s9xxx-armbian/releases/download/Armbian_bookworm_arm64_server_2026.07/Armbian_26.08.0_rockchip_wxy-oect_bookworm_6.1.141_server_2026.07.01.img.gz" \
            -o "Armbian_26.08.0_rockchip_wxy-oect_bookworm_6.1.141_server_2026.07.01.img.gz"
          echo "下载完成"
          ls -lh *.img.gz

      - name: Rebuild Armbian with NAS config
        run: |
          cd build/output/images
          gunzip -f Armbian_26.08.0_rockchip_wxy-oect_bookworm_6.1.141_server_2026.07.01.img.gz
          
          echo ">>> 准备打包..."
          cd "${{ github.workspace }}"
          bash rebuild \
            -b ${{ github.event.inputs.target_device }} \
            -k ${{ github.event.inputs.kernel_version }} \
            -a true \
            -t ext4 \
            -s 512/3000 \
            -n "WXY-OECT-NAS"
          
          echo ">>> 打包完成"
          ls -lh build/output/images/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nas-image-${{ github.event.inputs.target_device }}-${{ github.event.inputs.os_version }}
          path: build/output/images/*.img.gz
          retention-days: 30
